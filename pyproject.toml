[project]
name = "claude-rgb-status"
version = "0.1.0"
description = "Show what Claude Code is doing on a Lenovo Legion 4-zone RGB keyboard and a Windows tray icon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claude-rgb-status = "claude_rgb_status.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_rgb_status"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
